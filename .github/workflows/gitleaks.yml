name: Gitleaks

# Kun pull_request — IKKE push på main/develop.
# Begrundelse: pre-merge gitleaks-scan på PR fanger secrets før de når main.
# Push på main efter merge ville scanne det allerede-merged commit = duplicate work
# + fakturerer minutter dobbelt på samme indhold ([review] systemic fund 06-18).
# Hvis main alligevel skal scannes som backup, kør weekly cron + leakage-detection-
# rapport — ikke per-commit.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks (CLI v8.30.1)
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 5 -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
